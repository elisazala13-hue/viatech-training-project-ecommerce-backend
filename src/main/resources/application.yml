server:
  port: 8081

spring:
  application:
    name: ecommerce

  datasource:
    url: jdbc:mysql://localhost:3307/ecommerce
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000