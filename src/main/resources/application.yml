server:
  port: 8081

spring:
  application:
    name: ecommerce

  datasource:
    url: jdbc:mysql://localhost:3307/ecommerce
    username: root
    password: root

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    web:
      pageable:
        max-page-size: 50

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        default_batch_fetch_size: 50

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000 # access: 1 hour
  refresh-expiration-ms: 604800000 # refresh: 7 days

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

app:
  upload-dir: uploads
  currency: eur
  order-expiration-minutes: 30

logging:
  level:
    org.springframework.security: DEBUG