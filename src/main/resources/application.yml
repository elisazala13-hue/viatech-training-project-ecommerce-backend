server:
  port: 8081

spring:
  application:
    name: ecommerce
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    web:
      pageable:
        max-page-size: 50

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000              # access: 1 hour
  refresh-expiration-ms: 604800000    # refresh: 7 days

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

app:
  upload-dir: uploads
  currency: eur
  order-expiration-minutes: 30
  frontend-url: http://localhost:5174
  password-reset-expiration-minutes: 30
  mail:
    from: ecommerce@viatech.eu

logging:
  level:
    org.springframework.security: DEBUG